name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore InstrutorPro.sln

      - name: Build
        run: dotnet build InstrutorPro.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/InstrutorPro.UnitTests/InstrutorPro.UnitTests.csproj --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/InstrutorPro.IntegrationTests/InstrutorPro.IntegrationTests.csproj --no-build --configuration Release --verbosity normal
